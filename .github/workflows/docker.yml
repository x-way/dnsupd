name: Deploy

on: push

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      -
        name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push dnsupd
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          file: Dockerfile
          tags: |
            ghcr.io/x-way/dnsupd:latest
          push: ${{ github.ref == 'refs/heads/main' }}
          build-args: GIT_COMMIT=${{ github.sha }}
      -
        name: Notify webhook
        run: |
          curl -s -D - -H 'User-Agent: custom-github-deploy-webhook/0.01 (${{ github.sha }})' -X POST https://x-way.org/xh/dnsupd-reload
